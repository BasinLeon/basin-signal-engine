[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basin-nexus"
version = "5.1.0"
description = "Bifurcated GTM Operating Model - The Unified Signal Ledger"
readme = "README.md"
authors = [
    {name = "Leon Basin", email = "leon@basinleon.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
]

[project.optional-dependencies]
ai = [
    "langchain>=0.1.0",
    "langchain-google-genai>=0.0.6",
    "openai>=1.0.0",
]
scraping = [
    "beautifulsoup4>=4.12.0",
    "selenium>=4.10.0",
    "playwright>=1.35.0",
]
crm = [
    "salesforce-bulk>=2.2.0",
    "hubspot-api-client>=8.0.0",
]
all = [
    "basin-nexus[ai,scraping,crm]",
]

[project.urls]
Homepage = "https://github.com/BasinLeon/basin-signal-engine"
Documentation = "https://github.com/BasinLeon/basin-signal-engine/tree/main/docs"
Repository = "https://github.com/BasinLeon/basin-signal-engine"
